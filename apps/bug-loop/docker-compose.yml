version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bugloop-postgres
    environment:
      POSTGRES_USER: bugloop
      POSTGRES_PASSWORD: bugloop_password
      POSTGRES_DB: bugloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugloop"]
      interval: 10s
      timeout: 5s
      retries: 5

  bug-loop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bugloop-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bugloop:bugloop_password@postgres:5432/bugloop
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
