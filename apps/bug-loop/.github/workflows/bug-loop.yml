name: Bug Loop CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/bug-loop/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/bug-loop/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bugloop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/bug-loop/package-lock.json

      - name: Install dependencies
        working-directory: apps/bug-loop
        run: npm ci

      - name: Run linter
        working-directory: apps/bug-loop
        run: npm run lint

      - name: Run tests
        working-directory: apps/bug-loop
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bugloop_test
          NODE_ENV: test

      - name: Build
        working-directory: apps/bug-loop
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/bug-loop
        run: npm ci

      - name: Build
        working-directory: apps/bug-loop
        run: npm run build

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Deployment steps would go here"
          # Add your deployment commands (e.g., Docker build/push, server deploy, etc.)

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check health endpoint
        run: |
          curl -f ${{ secrets.PRODUCTION_URL }}/health || exit 1
